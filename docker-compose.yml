# A local PostgreSQL for development and the tests:   docker compose up -d db
# Then:  pip install -r requirements.txt  and  python scripts/build.py  (fills it with demo data)  and  python app/app.py
# The defaults in app/nmc/pg.py point at this server (localhost:55432), so nothing needs setting.
# "docker compose up -d" also runs the app itself on http://localhost:8000 against that database.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: nmcdev          # a local development password: this server is not reachable from anywhere else
      POSTGRES_DB: nmc
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"     # the "C" collation, so lists sort the way they always have here
    ports:
      - "55432:5432"
    volumes:
      - nmc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nmc"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:nmcdev@db:5432/nmc
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  nmc-pgdata:
